<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Feud</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0ea5e9,#38bdf8,#e0f2fe);
padding:20px;
}

h1{
text-align:center;
color:white;
font-size:60px;
margin:10px 0;
text-shadow:0 0 15px rgba(0,0,0,.3);
}

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
border-radius:20px;
padding:15px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,.15);
}

.score{
font-size:48px;
font-weight:bold;
color:#0284c7;
}

.question{
background:white;
padding:20px;
border-radius:20px;
font-size:32px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.answer{
background:#1d4ed8;
color:white;
padding:18px;
border-radius:15px;
margin-bottom:10px;
font-size:28px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.answer:hover{
transform:scale(1.02);
}

.revealed{
background:#06b6d4;
}

.controls{
background:white;
border-radius:20px;
padding:20px;
margin-top:25px;
}

input,button{
padding:10px;
font-size:16px;
margin:5px;
border-radius:10px;
border:none;
}

button{
background:#0284c7;
color:white;
cursor:pointer;
}

button:hover{
background:#0369a1;
}

.strikes
