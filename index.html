<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Feud</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0ea5e9,#38bdf8,#e0f2fe);
padding:20px;
}

h1{
text-align:center;
color:white;
font-size:60px;
margin:10px 0;
}

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
border-radius:20px;
padding:15px;
text-align:center;
}

.score{
font-size:48px;
font-weight:bold;
color:#0284c7;
}

.question{
background:white;
padding:20px;
border-radius:20px;
font-size:32px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.answer{
background:#1d4ed8;
color:white;
padding:18px;
border-radius:15px;
margin-bottom:10px;
font-size:28px;
text-align:center;
cursor:pointer;
}

.revealed{
background:#06b6d4;
}

.controls{
background:white;
border-radius:20px;
padding:20px;
margin-top:25px;
}

input,button{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
}

button{
background:#0284c7;
color:white;
cursor:pointer;
}

.strikes{
text-align:center;
font-size:80px;
margin:20px;
}

.badge{
text-align:center;
font-size:28px;
font-weight:bold;
color:white;
margin-bottom:15px;
}

.winner{
background:white;
padding:20px;
border-radius:20px;
margin-top:20px;
text-align:center;
}

.layout{
display:grid;
grid-template-columns:70% 30%;
gap:20px;
}

.hostPanel{
background:white;
border-radius:20px;
padding:20px;
height:fit-content;
position:sticky;
top:20px;
}

.hostQuestion{
background:#e0f2fe;
padding:15px;
border-radius:12px;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.hostAnswer{
background:#dbeafe;
padding:10px;
border-radius:10px;
margin-bottom:8px;
font-weight:bold;
}
</style>
</head>

<body>
<div class="layout">

<div>
<h1>TikTok Feud</h1>

<div class="badge" id="roundLabel"></div>

<div class="top">

<div class="card">
<h2>Team A</h2>
<div class="score" id="teamAScore">0</div>
</div>

<div class="card">
<h2>Board</h2>
<div class="score" id="boardScore">0</div>
</div>

<div class="card">
<h2>Team B</h2>
<div class="score" id="teamBScore">0</div>
</div>

</div>



<div id="answers"></div>

<div class="strikes" id="strikes"></div>



<div class="winner">
<h2>Current Winner</h2>
<h1 id="winnerText">Tie Game</h1>
</div>
</div>

<div class="hostPanel">

<h2>🎮 Host Panel</h2>

<h3>Current Question</h3>

<div
id="hostQuestion"
class="hostQuestion">
</div>

<h3>Answers</h3>

<div id="hostAnswers"></div>

<hr>



<h3>Game Controls</h3>

<button onclick="addStrike()">
Strike
</button>

<button onclick="removeStrike()">
Remove Strike
</button>

<button onclick="awardTeamA()">
Award Team A
</button>

<button onclick="awardTeamB()">
Award Team B
</button>

<button onclick="revealAll()">
Reveal All
</button>

<button onclick="nextRound()">
Next Round
</button>

<button onclick="resetRound()">
Reset Round
</button>

<hr>

<h3>Team Names</h3>

<input
id="teamAInput"
placeholder="Team A Name">

<button onclick="saveTeamAName()">
Save Team A
</button>

<br>

<input
id="teamBInput"
placeholder="Team B Name">

<button onclick="saveTeamBName()">
Save Team B
</button>

</div>

</div>
<script>

const questions = [

{
question:"Name something people check every day",
multiplier:1,
answers:[
["Phone",35],
["Email",27],
["Weather",15],
["Mailbox",12],
["Bank Account",11]
]
},

{
question:"Name something found in a refrigerator",
multiplier:1,
answers:[
["Milk",34],
["Eggs",24],
["Cheese",18],
["Juice",13],
["Leftovers",11]
]
},

{
question:"Name something people take on vacation",
multiplier:2,
answers:[
["Clothes",32],
["Phone",26],
["Toothbrush",17],
["Camera",13],
["Money",12]
]
},

{
question:"Name something people do at the beach",
multiplier:3,
answers:[
["Swim",31],
["Sunbathe",24],
["Build Sandcastles",16],
["Surf",15],
["Collect Shells",14]
]
},
  
{
question:"Name something people lose often",
multiplier:1,
answers:[
["Keys",35],
["Phone",28],
["Wallet",20],
["Remote",10],
["Glasses",7]
]
},

{
question:"Name something people bring to a picnic",
multiplier:1,
answers:[
["Food",40],
["Blanket",25],
["Drinks",15],
["Chairs",10],
["Cooler",10]
]
},

{
question:"Name an animal people might be afraid of",
multiplier:1,
answers:[
["Snake",35],
["Spider",30],
["Shark",18],
["Bear",10],
["Wolf",7]
]
},

{
question:"Name something found in a classroom",
multiplier:1,
answers:[
["Desk",30],
["Teacher",25],
["Books",20],
["Computer",15],
["Board",10]
]
},

{
question:"Name something people do before bed",
multiplier:1,
answers:[
["Brush Teeth",35],
["Watch TV",25],
["Read",15],
["Set Alarm",15],
["Pray",10]
]
},

{
question:"Name something found in a purse",
multiplier:1,
answers:[
["Wallet",35],
["Phone",25],
["Makeup",20],
["Keys",10],
["Receipts",10]
]
},

{
question:"Name a popular pizza topping",
multiplier:1,
answers:[
["Pepperoni",40],
["Sausage",20],
["Mushrooms",15],
["Cheese",15],
["Peppers",10]
]
},

{
question:"Name something kids don't want to do",
multiplier:1,
answers:[
["Homework",35],
["Chores",30],
["Go To Bed",15],
["Clean Room",10],
["Eat Vegetables",10]
]
},

{
question:"Name something found at a carnival",
multiplier:1,
answers:[
["Ferris Wheel",30],
["Games",25],
["Cotton Candy",20],
["Popcorn",15],
["Clowns",10]
]
},

{
question:"Name something people do at a gym",
multiplier:1,
answers:[
["Run",30],
["Lift Weights",25],
["Stretch",20],
["Bike",15],
["Swim",10]
]
},
  
function shuffleQuestions(){

for(
let i = questions.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[questions[i], questions[j]] =
[questions[j], questions[i]];

}

}

];

let round = 0;
let revealed = [];
let strikes = 0;

let teamA = 0;
let teamB = 0;

let teamAName =
localStorage.getItem("teamAName")
|| "Team A";

let teamBName =
localStorage.getItem("teamBName")
|| "Team B";

function currentQuestion(){
return questions[round];
}

function updateBoard(){

let q = currentQuestion();

document.getElementById(
"hostQuestion"
).innerText =
q.question;
let hostHtml = "";

q.answers.forEach((a,i)=>{

hostHtml += `
<div class="hostAnswer">

${i+1}. ${a[0]} (${a[1]})

<button
onclick="reveal(${i})"
style="float:right;">
Reveal
</button>

</div>
`;

});

document.getElementById(
"hostAnswers"
).innerHTML =
hostHtml;
let label = "Regular Round";

if(q.multiplier===2){
label = "🔥 DOUBLE POINTS 🔥";
}

if(q.multiplier===3){
label = "✨ TRIPLE POINTS ✨";
}

document.getElementById("roundLabel").innerText =
label;

let html = "";

q.answers.forEach((ans,index)=>{

let open = revealed.includes(index);

html += `
<div
class="answer ${open ? "revealed" : ""}"
onclick="reveal(${index})">
${open ?
(index+1)+". "+ans[0]+" ("+ans[1]+")"
:
(index+1)}
</div>
`;

});

document.getElementById("answers").innerHTML =
html;

document.getElementById("strikes").innerText =
"❌".repeat(strikes);

document.getElementById("boardScore").innerText =
boardScore();
document.querySelector(
".top .card:nth-child(1) h2"
).innerText = teamAName;

document.querySelector(
".top .card:nth-child(3) h2"
).innerText = teamBName;
document.getElementById("teamAScore").innerText =
teamA;

document.getElementById("teamBScore").innerText =
teamB;

let winner = "Tie Game";

if(teamA > teamB)
winner = teamAName;

if(teamB > teamA)
winner = teamBName;

document.getElementById("winnerText").innerText =
winner;

saveGame();

}

function reveal(index){

if(!revealed.includes(index)){
revealed.push(index);
updateBoard();
}

}




function boardScore(){

let q = currentQuestion();

let total = 0;

revealed.forEach(i=>{
total += q.answers[i][1];
});

return total * q.multiplier;

}

function awardTeamA(){

teamA += boardScore();
updateBoard();

}

function awardTeamB(){

teamB += boardScore();
updateBoard();

}

function addStrike(){

if(strikes < 3){

strikes++;
updateBoard();

}

}

function removeStrike(){

if(strikes > 0){

strikes--;
updateBoard();

}

}

function revealAll(){

revealed =
currentQuestion().answers.map((x,i)=>i);

updateBoard();

}

function resetRound(){

revealed = [];
strikes = 0;

updateBoard();

}

function nextRound(){

if(round < questions.length - 1){

round++;

revealed = [];
strikes = 0;

updateBoard();

}
else{

alert(
"All questions used!"
);

}

}

function saveGame(){

localStorage.setItem(
"tiktokfeud",
JSON.stringify({
round,
revealed,
strikes,
teamA,
teamB
})
);

}

function loadGame(){

const save =
localStorage.getItem("tiktokfeud");

if(!save) return;

const data = JSON.parse(save);

round = data.round || 0;
revealed = data.revealed || [];
strikes = data.strikes || 0;
teamA = data.teamA || 0;
teamB = data.teamB || 0;

}
function saveTeamAName(){

teamAName =
document.getElementById(
"teamAInput"
).value || "Team A";

localStorage.setItem(
"teamAName",
teamAName
);

updateBoard();

}

function saveTeamBName(){

teamBName =
document.getElementById(
"teamBInput"
).value || "Team B";

localStorage.setItem(
"teamBName",
teamBName
);

updateBoard();

}
shuffleQuestions();
loadGame();
updateBoard();

</script>

</body>
</html>
