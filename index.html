font-weight:bold;

function shuffleQuestions(){

for(
let i = questions.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[questions[i], questions[j]] =
[questions[j], questions[i]];

}

}

];

let round = 0;
let revealed = [];
let strikes = 0;

let teamA = 0;
let teamB = 0;

let teamAName =
localStorage.getItem("teamAName")
|| "Team A";

let teamBName =
localStorage.getItem("teamBName")
|| "Team B";

function currentQuestion(){
return questions[round];
}

function updateBoard(){

let q = currentQuestion();

document.getElementById(
"hostQuestion"
).innerText =
q.question;
let hostHtml = "";

q.answers.forEach((a,i)=>{

hostHtml += `
<div class="hostAnswer">

${i+1}. ${a[0]} (${a[1]})

<button
onclick="reveal(${i})"
style="float:right;">
Reveal
</button>

</div>
`;

});

document.getElementById(
"hostAnswers"
).innerHTML =
hostHtml;
let label = "Regular Round";

if(q.multiplier===2){
label = "🔥 DOUBLE POINTS 🔥";
}

if(q.multiplier===3){
label = "✨ TRIPLE POINTS ✨";
}

document.getElementById("roundLabel").innerText =
label;

let html = "";

q.answers.forEach((ans,index)=>{

let open = revealed.includes(index);

html += `
<div
class="answer ${open ? "revealed" : ""}"
onclick="reveal(${index})">
${open ?
(index+1)+". "+ans[0]+" ("+ans[1]+")"
:
(index+1)}
</div>
`;

});

document.getElementById("answers").innerHTML =
html;

document.getElementById("strikes").innerText =
"❌".repeat(strikes);

document.getElementById("boardScore").innerText =
boardScore();
document.querySelector(
".top .card:nth-child(1) h2"
).innerText = teamAName;

document.querySelector(
".top .card:nth-child(3) h2"
).innerText = teamBName;
document.getElementById("teamAScore").innerText =
teamA;

document.getElementById("teamBScore").innerText =
teamB;

let winner = "Tie Game";

if(teamA > teamB)
winner = teamAName;

if(teamB > teamA)
winner = teamBName;

document.getElementById("winnerText").innerText =
winner;

saveGame();

}

function reveal(index){

if(!revealed.includes(index)){
revealed.push(index);
updateBoard();
}

}




function boardScore(){

let q = currentQuestion();

let total = 0;

revealed.forEach(i=>{
total += q.answers[i][1];
});

return total * q.multiplier;

}

function awardTeamA(){

teamA += boardScore();
updateBoard();

}

function awardTeamB(){

teamB += boardScore();
updateBoard();

}

function addStrike(){

if(strikes < 3){

strikes++;
updateBoard();

}

}

function removeStrike(){

if(strikes > 0){

strikes--;
updateBoard();

}

}

function revealAll(){

revealed =
currentQuestion().answers.map((x,i)=>i);

updateBoard();

}

function resetRound(){

revealed = [];
strikes = 0;

updateBoard();

}

function nextRound(){

if(round < questions.length - 1){

round++;

revealed = [];
strikes = 0;

updateBoard();

}
else{

alert(
"All questions used!"
);

}

}

function saveGame(){

localStorage.setItem(
"tiktokfeud",
JSON.stringify({
round,
revealed,
strikes,
teamA,
teamB
})
);

}

function loadGame(){

const save =
localStorage.getItem("tiktokfeud");

if(!save) return;

const data = JSON.parse(save);

round = data.round || 0;
revealed = data.revealed || [];
strikes = data.strikes || 0;
teamA = data.teamA || 0;
teamB = data.teamB || 0;

}

teamAName =
document.getElementById(
"teamAInput"
).value || "Team A";

localStorage.setItem(
"teamAName",
teamAName

updateBoard();

}

function saveTeamBName(){

"teamBName",

updateBoard();

}
function shuffleQuestions(){

for (
let i = questions.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[questions[i], questions[j]] =

}

}
  
function resetGame(){

if(
!confirm(
"Reset the entire game and randomize questions?"
)
){
return;
}

shuffleQuestions();

round = 0;

revealed = [];

strikes = 0;

teamA = 0;

teamB = 0;

saveGame();

updateBoard();

}

revealed = [];

strikes = 0;

teamA = 0;

teamB = 0;

localStorage.removeItem(

}

round = 0;
